
name: Build Vinyl Recognition APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q VinylRecognition-Android-project.zip -d /tmp/vinyl
          echo "CONTENIDO DEL ZIP:"
          find /tmp/vinyl -maxdepth 3 -type f | head -100
          echo "BUSCANDO ARCHIVOS GRADLE:"
          find /tmp/vinyl \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          find /tmp/vinyl -name gradlew -type f
          GRADLEW=$(find /tmp/vinyl -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encuentra gradlew en el ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl-Recognition-APK
          path: /tmp/vinyl/**/build/outputs/apk/debug/*.apk
          
          
          
