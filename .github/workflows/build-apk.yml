
name: Build Vinyl Recognition APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          unzip -q VinylRecognition-Android-project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      
      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          APP_FILE="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$APP_FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if 'jvmTarget = "17"' not in s:
              pos = s.rfind("\n}")
              if pos < 0:
                  raise SystemExit("No se encuentra el bloque android")
              s = s[:pos] + """
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """ + s[pos:]
              p.write_text(s)

          print("Configuración Java y Kotlin 17 aplicada")
          PY

                    python3 - "$APP_FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if 'androidx.core:core-ktx' not in s:
              s += '''

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          '''
              p.write_text(s)
          print("Dependencias AndroidX añadidas")
          PY

          gradle -p "$PROJECT_DIR" assembleDebug
          
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl-Recognition-APK
          path: project/VinylRecognition/app/build/outputs/apk/debug/app-debug.apk

          
          
          
