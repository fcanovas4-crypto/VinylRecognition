
name: Build Vinyl Recognition APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          unzip -q VinylRecognition-Android-project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      
    
      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          manifest = root / "app/src/main/AndroidManifest.xml"
          if not manifest.exists():
              raise SystemExit("No se encuentra AndroidManifest.xml")

          s = manifest.read_text()

          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />'
              )

          if 'android.hardware.camera' not in s:
              s = s.replace(
                  '<application',
                  '<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application'
              )

          manifest.write_text(s)

          activity = root / "app/src/main/java/com/vinylrecognition/app/MainActivity.kt"
          if not activity.exists():
              raise SystemExit("No se encuentra MainActivity.kt")

          kotlin = '''
                
           package com.vinylrecognition.app

            import android.Manifest
            import android.annotation.SuppressLint
            import android.app.Activity
            import android.content.ContentValues
            import android.content.Intent
            import android.content.pm.PackageManager
            import android.net.Uri
            import android.os.Bundle
            import android.provider.MediaStore
            import android.view.View
            import android.webkit.PermissionRequest
            import android.webkit.ValueCallback
            import android.webkit.WebChromeClient
            import android.webkit.WebResourceRequest
            import android.webkit.WebView
            import android.webkit.WebViewClient
            import androidx.activity.ComponentActivity
            import androidx.activity.result.contract.ActivityResultContracts
            import androidx.core.content.ContextCompat

            class MainActivity : ComponentActivity() {

    private lateinit var webView: WebView
     private val appUrl = "https://vinyl-recognition-mu-bcnb.bolt.host"
     private val appHost = "vinyl-recognition-mu-bcnb.bolt.host"

    private var pendingWebPermission: PermissionRequest? = null
    private var fileChooserCallback: ValueCallback<Array<Uri>>? = null
    private var cameraImageUri: Uri? = null

    private val mediaPermissions = registerForActivityResult(        
    ActivityResultContracts.RequestMultiplePermissions()    ) 
            { results ->
              val request = pendingWebPermission
               pendingWebPermission = null

        if (request != null) {
            val granted = request.resources.all { resource ->
                when (resource) {
                    PermissionRequest.RESOURCE_AUDIO_CAPTURE ->
                        results[Manifest.permission.RECORD_AUDIO]
                            ?: (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED)

                    PermissionRequest.RESOURCE_VIDEO_CAPTURE ->
                        results[Manifest.permission.CAMERA]
                            ?: (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED)

                    else -> false
                }
            }

            if (granted) request.grant(request.resources)
            else request.deny()
        }
    }

    private val fileChooserLauncher = registerForActivityResult(
        ActivityResultContracts.StartActivityForResult()
    ) { result ->
        val callback = fileChooserCallback
        fileChooserCallback = null

        if (result.resultCode == Activity.RESULT_OK) {
            val selectedUri = result.data?.data ?: cameraImageUri
            if (selectedUri != null) callback?.onReceiveValue(arrayOf(selectedUri))
            else callback?.onReceiveValue(null)
        } else {
            callback?.onReceiveValue(null)
        }
    }

    @SuppressLint("SetJavaScriptEnabled")
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        window.decorView.systemUiVisibility = (
            View.SYSTEM_UI_FLAG_FULLSCREEN or
            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
            View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
        )

        webView = WebView(this)
        setContentView(webView)

        webView.settings.javaScriptEnabled = true
        webView.settings.domStorageEnabled = true
        webView.settings.mediaPlaybackRequiresUserGesture = false

        webView.webViewClient = object : WebViewClient() {
            override fun shouldOverrideUrlLoading(
                view: WebView,
                request: WebResourceRequest
            ): Boolean {
                return request.url.scheme != "https" || request.url.host != appHost
            }
        }

        webView.webChromeClient = object : WebChromeClient() {

            override fun onPermissionRequest(request: PermissionRequest) {
                runOnUiThread {
                    if (request.origin.host != appHost || request.origin.scheme != "https") {
                        request.deny()
                        return@runOnUiThread
                    }

                    val permissions = mutableListOf<String>()

                    if (PermissionRequest.RESOURCE_AUDIO_CAPTURE in request.resources)
                        permissions.add(Manifest.permission.RECORD_AUDIO)

                    if (PermissionRequest.RESOURCE_VIDEO_CAPTURE in request.resources)
                        permissions.add(Manifest.permission.CAMERA)

                    if (permissions.isEmpty()) {
                        request.deny()
                        return@runOnUiThread
                    }

                    val missing = permissions.filter {
                        ContextCompat.checkSelfPermission(this@MainActivity, it) != PackageManager.PERMISSION_GRANTED
                    }

                    if (missing.isEmpty()) {
                        request.grant(request.resources)
                    } else {
                        pendingWebPermission = request
                        mediaPermissions.launch(missing.toTypedArray())
                    }
                }
            }

            override fun onShowFileChooser(
                webView: WebView?,
                filePathCallback: ValueCallback<Array<Uri>>,
                fileChooserParams: FileChooserParams
            ): Boolean {
                fileChooserCallback?.onReceiveValue(null)
                fileChooserCallback = filePathCallback

                val galleryIntent = Intent(Intent.ACTION_GET_CONTENT).apply {
                    addCategory(Intent.CATEGORY_OPENABLE)
                    type = "image/*"
                }

                val cameraIntent = Intent(MediaStore.ACTION_IMAGE_CAPTURE)

                val values = ContentValues().apply {
                    put(MediaStore.Images.Media.DISPLAY_NAME, "vinyl_photo.jpg")
                    put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                }

                cameraImageUri = contentResolver.insert(
                    MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                    values
                )

                if (cameraImageUri != null) {
                    cameraIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraImageUri)
                }

                val chooser = Intent.createChooser(galleryIntent, "Elegir fotografía")

                if (cameraImageUri != null &&
                    cameraIntent.resolveActivity(packageManager) != null
                ) {
                    chooser.putExtra(
                        Intent.EXTRA_INITIAL_INTENTS,
                        arrayOf(cameraIntent)
                    )
                }

                fileChooserLauncher.launch(chooser)
                return true
            }
        }

        if (savedInstanceState == null) webView.loadUrl(appUrl)
        else webView.restoreState(savedInstanceState)
    }

    override fun onSaveInstanceState(outState: Bundle) {
        webView.saveState(outState)
        super.onSaveInstanceState(outState)
    }

    @Deprecated("Deprecated in Android API")
    override fun onBackPressed() {
        if (::webView.isInitialized && webView.canGoBack()) webView.goBack()
        else super.onBackPressed()
    }

    override fun onDestroy() {
        fileChooserCallback?.onReceiveValue(null)
        fileChooserCallback = null

        if (::webView.isInitialized) webView.destroy()
        super.onDestroy()
    }
}

          '''

          activity.write_text(kotlin)
          gradle_file = root / "app/build.gradle.kts"
          gradle_file = root / "app/build.gradle.kts"
          g = gradle_file.read_text()

          if "androidx.activity:activity-ktx" not in g:
              g += '\ndependencies {\n    implementation("androidx.activity:activity-ktx:1.10.0")\n    implementation("androidx.core:core-ktx:1.15.0")\n}\n'

          if "sourceCompatibility = JavaVersion.VERSION_17" not in g:
              g = g.replace(
                  "android {",
                  "android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }"
              )

          gradle_file.write_text(g)
          print("Permiso y gestión de cámara actualizados")
          PY

          gradle -p "$PROJECT_DIR" assembleDebug
          
          
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl-Recognition-APK
          path: project/VinylRecognition/app/build/outputs/apk/debug/app-debug.apk

          
          
          
